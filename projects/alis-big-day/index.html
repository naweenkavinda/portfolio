<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C4BEF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ali's Big Day">
<meta name="description" content="Ali's Big Day: a 15-page interactive storybook for ages 3-6.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ali's Big Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one purple hardcover storybook on a drifting sky; each page = number + title, a play stage, and Ali's speech bubble */
:root{
  --sun:#FFC93C; --coral:#FF5A5F; --teal:#18B6A6; --grape:#6C4BEF; --leaf:#4CBF5A; --pink:#FF7EB6; --blue:#3FA9F5; --orange:#FF9F43;
  --ink:#2B2140; --paper:#FFFBF2; --paper2:#FFF3D6; --muted:#6E6386;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);background:linear-gradient(180deg,#6CCBFF 0%,#B8E9FF 55%,#FFE7A6 100%);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button{font-family:var(--display);color:var(--ink);cursor:pointer;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* ---------- sky decoration ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;left:0;width:170px;height:56px;background:#fff;border-radius:60px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:76px;height:76px;left:24px;top:-36px}
.cloud::after{width:96px;height:96px;left:64px;top:-48px}
@keyframes drift{from{transform:translateX(-260px) scale(var(--k,1))}to{transform:translateX(calc(100vw + 260px)) scale(var(--k,1))}}
.floaty{position:absolute;font-size:34px;animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px))}
.pcount{display:none;flex:1;text-align:center;font:800 20px/1 var(--display);color:#fff;text-shadow:0 2px 0 var(--grape)}
.topbar{display:flex;align-items:center;gap:10px}
.logo{font:800 clamp(20px,3vw,30px)/1 var(--display);color:#fff;white-space:nowrap;text-shadow:0 3px 0 var(--grape),0 6px 12px rgba(60,30,120,.3);letter-spacing:.5px}
.progress{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-width:0}
.progress i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;transition:transform .3s,background .3s}
.progress i.got{background:var(--sun)}
.progress i.cur{transform:scale(1.4);border-color:var(--grape)}
.iconbtn{flex:none;width:50px;height:50px;border-radius:50%;border:none;background:#fff;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(43,33,64,.18)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,64,.18)}
.bag{position:relative}
.bag b{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--coral);color:#fff;font:800 14px/24px var(--display);text-align:center;padding:0 5px;border:2px solid #fff}
.bag.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-8deg)}}
.gear{width:40px;height:40px;font-size:18px;opacity:.85}

/* ---------- book ---------- */
.desk{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.book{position:relative;width:100%;height:100%;max-width:1180px;max-height:860px;border-radius:24px;padding:12px 14px 14px 30px;background:linear-gradient(135deg,#7D5CFA,#5636D6);box-shadow:0 22px 50px rgba(43,33,64,.35),inset 0 0 0 3px rgba(255,255,255,.25)}
.book::before{content:"";position:absolute;left:9px;top:20px;bottom:20px;width:12px;border-radius:8px;background:repeating-linear-gradient(180deg,var(--sun) 0 14px,transparent 14px 32px)}
.pages{position:relative;width:100%;height:100%;perspective:2400px;isolation:isolate}
.pages::before,.pages::after{content:"";position:absolute;inset:0;z-index:0;border-radius:6px 16px 16px 6px;background:#F3E3BF}
.pages::before{transform:translate(7px,6px);background:#E4CC97}
.pages::after{transform:translate(3.5px,3px)}
.page{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border-radius:6px 16px 16px 6px;transform-origin:left center;backface-visibility:hidden;box-shadow:inset 22px 0 24px -18px rgba(43,33,64,.3)}
.page.turn-out{z-index:3;animation:turnOut .44s cubic-bezier(.55,.05,.75,.6) forwards}
.page.turn-in{z-index:3;animation:turnIn .44s cubic-bezier(.25,.4,.45,1) forwards}
@keyframes turnOut{0%{transform:rotateY(0) translateZ(0)}100%{transform:rotateY(-90deg) translateZ(40px)}}
@keyframes turnIn{0%{transform:rotateY(-90deg) translateZ(40px)}100%{transform:rotateY(0) translateZ(0)}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:20;opacity:0;background:linear-gradient(90deg,rgba(43,33,64,.05),rgba(43,33,64,.55))}
.turn-out .shade{animation:fadeIn .44s forwards}
.turn-in .shade{animation:fadeOut .44s forwards}
.reveal .shade{opacity:.6;animation:fadeOut .9s forwards;background:linear-gradient(90deg,rgba(43,33,64,.5),rgba(43,33,64,.1) 60%)}
/* the back of the turning sheet: paper with a soft curl shade */
.leaf{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:16px 6px 6px 16px;transform-origin:left center;background:linear-gradient(90deg,#D9C79F 0%,#FFF8E6 35%,#F6EBD0 75%,#E8D5A8 100%);box-shadow:0 10px 30px rgba(43,33,64,.35)}
.leaf::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(rgba(108,75,239,.1) 2px,transparent 3px) 0 0/20px 20px}
.leaf-out{animation:leafOut .46s cubic-bezier(.2,.6,.35,1) forwards}
.leaf-in{animation:leafIn .42s cubic-bezier(.55,0,.8,.6) forwards}
@keyframes leafOut{0%{transform:rotateY(-90deg) translateZ(40px);opacity:1}70%{opacity:1}100%{transform:rotateY(-178deg);opacity:0}}
@keyframes leafIn{0%{transform:rotateY(-178deg);opacity:0}30%{opacity:1}100%{transform:rotateY(-90deg) translateZ(40px);opacity:1}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

.phead{display:flex;align-items:center;gap:10px;padding:10px 14px 0 18px}
.pnum{flex:none;min-width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--tint,var(--coral));color:#fff;font:800 19px/1 var(--display);box-shadow:0 3px 0 rgba(43,33,64,.2)}
.ptitle{flex:1;min-width:0;margin:0;font:800 clamp(20px,3.2vw,34px)/1.05 var(--display);text-wrap:balance}
.replay{width:46px;height:46px;font-size:21px;background:var(--paper2)}
.stage{position:relative;flex:1;min-height:0;margin:8px 14px 0 18px;border-radius:20px;overflow:hidden;container-type:size;background:var(--paper2);touch-action:none}
.instr{display:flex;align-items:center;gap:8px;min-height:66px;padding:8px 84px 12px 88px}
.instr .mini{flex:none;width:48px;height:48px}
.instr p{flex:1;min-width:0;margin:0;padding:7px 14px;border:3px solid var(--ink);border-radius:18px;background:#fff;font:700 clamp(15px,2.1vw,22px)/1.25 var(--body);box-shadow:0 3px 0 rgba(43,33,64,.15)}
.nav{position:absolute;bottom:20px;z-index:6;width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #D99A00,0 10px 18px rgba(43,33,64,.3)}
.nav svg{width:30px;height:30px}
.nav.prev{left:38px}
.nav.next{right:22px}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 #D99A00}
.nav[disabled]{opacity:.3;pointer-events:none}
.nav.pulse{background:var(--leaf);box-shadow:0 5px 0 #2E8F3B,0 0 0 8px rgba(76,191,90,.3);animation:navpulse 1s ease-in-out infinite}
@keyframes navpulse{50%{transform:scale(1.14)}}
.nav{transition:right .65s cubic-bezier(.3,1.4,.5,1),bottom .65s cubic-bezier(.3,1.4,.5,1),width .65s cubic-bezier(.3,1.4,.5,1),height .65s cubic-bezier(.3,1.4,.5,1),background-color .3s}
.nav svg{transition:width .65s,height .65s}
.nav.next.center{right:calc(50% - 60px);bottom:calc(50% - 50px);width:120px;height:120px;border-width:6px;z-index:9}
.nav.next.center svg{width:58px;height:58px}
.nav.next.center::after{content:"Next page";position:absolute;top:100%;left:50%;margin-top:14px;translate:-50% 0;white-space:nowrap;padding:7px 16px;border-radius:999px;background:#fff;color:var(--ink);font:800 19px/1 var(--display);box-shadow:0 4px 0 rgba(43,33,64,.2)}
.veil{position:absolute;inset:0;z-index:8;border-radius:24px;background:rgba(43,33,64,.3);opacity:0;pointer-events:none;transition:opacity .5s}
.veil.on{opacity:1;pointer-events:auto}

@media (max-width:620px){
  .logo,.progress{display:none}
  .pcount{display:block}
  .iconbtn{width:44px;height:44px;font-size:21px}
  .gear{width:38px;height:38px;font-size:17px}
  .book{padding:6px 6px 8px 18px;border-radius:16px}
  .book::before{left:5px;width:8px;top:14px;bottom:14px}
  .phead{padding:6px 6px 0 8px;gap:8px}
  .pnum{min-width:32px;height:32px;font-size:16px}
  .ptitle{font-size:19px}
  .replay{width:38px;height:38px;font-size:18px}
  .stage{margin:6px 6px 0 8px;border-radius:14px}
  .instr{padding:6px 58px 8px 62px;min-height:58px}
  .instr .mini{display:none}
  .instr p{font-size:14px;padding:5px 10px;border-width:2.5px;border-radius:14px}
  .nav{width:48px;height:48px;bottom:12px;border-width:3px}
  .nav svg{width:24px;height:24px}
  .nav.prev{left:22px}.nav.next{right:10px}
  .nav.next.center{width:104px;height:104px;right:calc(50% - 52px);bottom:calc(50% - 40px)}
  .nav.next.center svg{width:50px;height:50px}
}
@media (max-height:520px){
  #app{gap:4px;padding-block:max(4px,env(safe-area-inset-top,0px)) max(4px,env(safe-area-inset-bottom,0px))}
  .logo{font-size:18px}
  .iconbtn{width:38px;height:38px;font-size:18px}
  .gear{width:34px;height:34px;font-size:15px}
  .progress i{width:11px;height:11px}
  .book{padding:5px 6px 6px 18px;border-radius:14px}
  .book::before{left:5px;width:8px;top:12px;bottom:12px}
  .phead{padding:4px 8px 0 10px}
  .pnum{min-width:28px;height:28px;font-size:14px}
  .ptitle{font-size:18px}
  .replay{width:32px;height:32px;font-size:15px}
  .stage{margin:4px 8px 0 10px;border-radius:12px}
  .instr{min-height:44px;padding:4px 58px 5px 62px}
  .instr .mini{width:34px;height:34px}
  .instr p{font-size:14px;padding:3px 10px;border-width:2.5px}
  .nav{width:44px;height:44px;bottom:7px;border-width:3px}
  .nav svg{width:22px;height:22px}
  .nav.prev{left:22px}.nav.next{right:10px}
  .nav.next.center{width:88px;height:88px;right:calc(50% - 44px);bottom:calc(50% - 30px)}
  .nav.next.center svg{width:42px;height:42px}
  .nav.next.center::after{font-size:16px;margin-top:8px}
}

/* ---------- shared bits ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf{position:absolute;width:12px;height:12px;border-radius:3px;font:800 22px/1 var(--display)}
.flysticker{position:absolute;font-size:84px;filter:drop-shadow(0 6px 8px rgba(43,33,64,.35))}
.glow{animation:glow .7s ease-in-out 4}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,201,60,0))}50%{filter:drop-shadow(0 0 12px #FFC93C) drop-shadow(0 0 4px #fff)}}
.nope{animation:nope .45s}
@keyframes nope{0%,100%{translate:0}20%{translate:-9px}40%{translate:9px}60%{translate:-6px}80%{translate:6px}}
.hop{animation:hop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{40%{translate:0 -18%;scale:1.05 .95}70%{translate:0 0;scale:.96 1.04}}
.wiggle{animation:wiggle .6s}
@keyframes wiggle{25%{rotate:-6deg}50%{rotate:6deg}75%{rotate:-3deg}}
.dragitem{touch-action:none;cursor:grab;transition:transform .35s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:2}
.dragitem.lifting{z-index:30;filter:drop-shadow(0 10px 8px rgba(43,33,64,.3))}
.dragitem.selected{animation:selpulse .8s ease-in-out infinite;z-index:5}
@keyframes selpulse{50%{scale:1.12;filter:drop-shadow(0 0 10px #FFC93C)}}
.want{animation:want 1s ease-in-out infinite}
@keyframes want{50%{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 6px #FFC93C)}}
.over{scale:1.08;filter:drop-shadow(0 0 14px #FFC93C)}

/* ---------- Ali ---------- */
.ali{display:block;width:100%;height:100%;overflow:visible}
.ali *{transform-box:view-box}
.ali .whole{transform-origin:110px 205px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.ali .ear-l{transform-origin:92px 90px;animation:earL 2.6s ease-in-out infinite}
.ali .ear-r{transform-origin:128px 90px;animation:earR 2.6s ease-in-out infinite}
@keyframes earL{50%{transform:rotate(-10deg)}}
@keyframes earR{50%{transform:rotate(10deg)}}
.ali .trunk{transform-origin:110px 106px;animation:trunk 3.2s ease-in-out infinite;transition:transform .45s}
@keyframes trunk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.ali .eyes{transform-origin:110px 88px;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ali .eyes-closed,.ali .mouth-open{display:none}
.ali.sleep .eyes{display:none}
.ali.sleep .eyes-closed{display:inline}
.ali.sleep .ear-l,.ali.sleep .ear-r{animation-duration:5s}
.ali.open .mouth-open{display:inline}
.ali.open .mouth{display:none}
.ali.eat .trunk{animation:none;transform:rotate(152deg)}
.ali.chew .whole{animation:chew .22s 3}
@keyframes chew{50%{transform:scale(1.04,.96)}}
.ali.no .whole{animation:headno .5s 2}
@keyframes headno{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.ali.flapfast .ear-l,.ali.flapfast .ear-r{animation-duration:.3s}
.ali{filter:drop-shadow(0 9px 7px rgba(43,33,64,.25))}
.ali.grandma{filter:hue-rotate(38deg) saturate(.8) brightness(1.04) drop-shadow(0 9px 7px rgba(43,33,64,.25))}
.ali .tail{transform-origin:162px 150px;animation:tail 1.1s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(22deg)}}
.ali .look{animation:look 7s ease-in-out infinite}
@keyframes look{0%,38%,100%{transform:translate(0,0)}44%,58%{transform:translate(3.5px,1px)}64%,80%{transform:translate(-3.5px,0)}}

/* ---------- page 1: dawn cover ---------- */
.sc-dawn{background:linear-gradient(180deg,#FFB86B 0%,#FFE0A3 45%,#FFF4D2 70%)}
.hill{position:absolute;border-radius:50%;bottom:-38cqh}
.hill.h1{left:-20cqw;width:80cqw;height:70cqh;background:#7DD56F}
.hill.h2{right:-25cqw;width:90cqw;height:62cqh;background:#5BC85B}
.cover-title{position:absolute;left:5cqw;top:6cqh;margin:0;font:800 min(15cqh,13cqw)/.9 var(--display);transition:transform .8s,opacity .8s;transform-origin:left top}
.cover-title span{display:inline-block;-webkit-text-stroke:0;text-shadow:0 .06em 0 rgba(43,33,64,.25);animation:letter 2.4s ease-in-out infinite}
@keyframes letter{50%{transform:translateY(-.08em) rotate(-4deg)}}
.started .cover-title{transform:scale(.55);opacity:.9}
.sunbtn{position:absolute;right:8cqw;top:12cqh;width:min(34cqh,30cqw);aspect-ratio:1;border:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3A6,#FFC93C 60%,#FF9F1C);box-shadow:0 0 0 10px rgba(255,201,60,.35),0 0 40px 18px rgba(255,180,60,.55);font:800 min(7cqh,6cqw)/1 var(--display);color:#7A3E00;transition:all 1s cubic-bezier(.3,1.3,.5,1);animation:sunpulse 1.6s ease-in-out infinite;z-index:3}
.sunbtn::before{content:"";position:absolute;inset:-22%;border-radius:50%;z-index:-1;background:repeating-conic-gradient(rgba(255,201,60,.7) 0 10deg,transparent 10deg 30deg);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sunpulse{50%{scale:1.06}}
.sunbtn.risen{right:3cqw;top:3cqh;width:min(18cqh,15cqw);font-size:0;animation:none}
.ali-spot{position:absolute;left:50%;bottom:4cqh;width:min(52cqh,42cqw);aspect-ratio:1;translate:-50% 0;z-index:2;cursor:pointer;transition:bottom .6s}
.ali-spot .blanket{position:absolute;left:4%;right:4%;bottom:2%;height:34%;border-radius:40% 40% 18% 18%;background:repeating-linear-gradient(45deg,#FF7EB6 0 14px,#FF9FCB 14px 28px);border:4px solid #fff;transition:transform .7s,opacity .7s}
.ali-spot.awake .blanket{transform:translateY(60%);opacity:0}
.zzz{position:absolute;left:-2%;top:6%;font:800 min(8cqh,6cqw)/1 var(--display);color:var(--grape)}
.zzz i{position:absolute;font-style:normal;animation:zz 2.4s ease-in infinite;opacity:0}
.zzz i:nth-child(2){animation-delay:.8s;left:1em}.zzz i:nth-child(3){animation-delay:1.6s;left:2em}
@keyframes zz{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-2.5em) scale(1.3)}}
.awake .zzz{display:none}
.rooster{position:absolute;right:10cqw;bottom:20cqh;font-size:min(20cqh,16cqw);z-index:2;transform-origin:50% 100%;translate:0 60%;opacity:0;transition:all .6s cubic-bezier(.3,1.5,.5,1);cursor:pointer}
.rooster.show{translate:0 0;opacity:1}
.rooster.crow{animation:crow .4s ease-in-out 4}
.crow-note{position:absolute;right:-.2em;top:-.4em;font-size:.45em;color:var(--coral);opacity:0}
.rooster.crow .crow-note{opacity:1;animation:zz 1.2s infinite}
@keyframes crow{50%{transform:rotate(-10deg) scale(1.12)}}

/* ---------- page 2: bath ---------- */
.sc-bath{background:#DFF4FF;background-image:linear-gradient(90deg,rgba(255,255,255,.7) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.7) 2px,transparent 2px);background-size:56px 56px}
.tub{position:absolute;left:50%;bottom:-4cqh;translate:-50% 0;width:min(70cqw,95cqh);height:36cqh}
.tub-ali{position:absolute;left:50%;bottom:30%;width:68%;aspect-ratio:1;translate:-50% 0}
.tub-front{position:absolute;inset:auto 0 0 0;height:62%;border-radius:22px 22px 60px 60px;background:linear-gradient(180deg,#fff,#E3F1FF);border:5px solid #9FD5FF;box-shadow:inset 0 -12px 0 rgba(63,169,245,.15)}
.foam{position:absolute;left:4%;right:4%;bottom:52%;height:16%;background:radial-gradient(circle at 10% 60%,#fff 0 18%,transparent 19%),radial-gradient(circle at 28% 40%,#fff 0 22%,transparent 23%),radial-gradient(circle at 50% 60%,#fff 0 20%,transparent 21%),radial-gradient(circle at 72% 40%,#fff 0 22%,transparent 23%),radial-gradient(circle at 90% 60%,#fff 0 18%,transparent 19%)}
.bubble{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;z-index:4;background:radial-gradient(circle at 30% 28%,#fff 0 9%,rgba(255,255,255,.55) 13%,rgba(160,220,255,.35) 45%,rgba(63,169,245,.6) 100%);border:3px solid rgba(255,255,255,.9);box-shadow:inset -6px -8px 14px rgba(63,169,245,.35);display:grid;place-items:center}
.bubble i{font-style:normal;color:var(--sun);font-size:42%;text-shadow:0 0 6px #fff}
.bubble.pink{background:radial-gradient(circle at 30% 28%,#fff 0 9%,rgba(255,255,255,.55) 13%,rgba(255,190,220,.35) 45%,rgba(255,126,182,.6) 100%);box-shadow:inset -6px -8px 14px rgba(255,126,182,.35)}
.bubble.wob{animation:wiggle .5s}
.bcount{position:absolute;left:12px;top:10px;display:flex;gap:6px;z-index:5}
.bcount i{width:22px;height:22px;border-radius:50%;border:3px solid #fff;background:rgba(63,169,245,.25)}
.bcount i.on{background:var(--blue)}
.drop{position:absolute;width:10px;height:10px;border-radius:50%;background:#9FD5FF;z-index:6;pointer-events:none}

/* ---------- page 3: room ---------- */
.sc-room{background:linear-gradient(180deg,#FFE3D3 0 64%,#E3A86B 64% 100%)}
.sc-room::before{content:"";position:absolute;inset:0 0 36% 0;background-image:radial-gradient(rgba(255,255,255,.7) 3px,transparent 4px);background-size:34px 34px}
.sc-room::after{content:"";position:absolute;inset:64% 0 0 0;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(120,70,30,.18) 70px 74px)}
.furn{position:absolute;z-index:2;pointer-events:none;line-height:1;translate:-50% -50%;font-size:calc(var(--s)*1cqmin)}
.findme,.distract{position:absolute;z-index:1;border:none;background:none;padding:0;line-height:1;font-size:calc(var(--s)*1cqmin);translate:-50% -50%;cursor:pointer}
.distract{z-index:3}
.findme.peek{animation:glow .7s ease-in-out 4}
.tray{position:absolute;left:50%;top:8px;translate:-50% 0;z-index:5;display:flex;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.85);border:3px solid #fff;box-shadow:0 4px 10px rgba(43,33,64,.15)}
.slot{width:min(11cqmin,58px);aspect-ratio:1;display:grid;place-items:center;font-size:min(8cqmin,40px);border-radius:50%;background:var(--paper2)}
.slot b{filter:grayscale(1) brightness(0);opacity:.25;transition:all .4s}
.slot.got{background:#D8F5D0}
.slot.got b{filter:none;opacity:1;animation:hop .5s}

/* ---------- page 4: feeding ---------- */
.sc-garden{background:radial-gradient(circle at 80% 15%,#FFF6C8 0 12%,transparent 13%),linear-gradient(180deg,#C9F1FF 0 55%,#8EDB7B 55%)}
.feed-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;gap:12px;padding:12px}
.basket{width:min(44cqw,60cqh);padding:14px;border-radius:22px 22px 40px 40px;background:repeating-linear-gradient(45deg,#C98B4A 0 10px,#B5763A 10px 20px);border:5px solid #8C5523;box-shadow:0 10px 0 rgba(43,33,64,.15)}
.basket-items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.fruit{border:none;background:none;padding:0;font-size:min(11cqh,9cqw);line-height:1.1}
.feed-ali{position:relative;width:min(46cqw,78cqh);aspect-ratio:1}
.mouth-zone{position:absolute;left:30%;top:42%;width:40%;height:32%;border-radius:50%}
.meter{position:absolute;left:50%;top:-2%;translate:-50% 0;display:flex;gap:6px;z-index:3}
.meter i{width:min(8cqmin,40px);aspect-ratio:1;border-radius:50%;background:#fff;border:3px dashed var(--orange);display:grid;place-items:center;font-style:normal;font-size:min(5cqmin,26px)}
.meter i.on{border-style:solid;background:#FFE7A6;animation:hop .5s}
.heart{position:absolute;font-size:28px;pointer-events:none;z-index:8}
@container (orientation:portrait){.feed-wrap{flex-direction:column-reverse}.basket{width:86cqw}.feed-ali{width:min(64cqw,52cqh)}}

/* ---------- page 5: market ---------- */
.sc-market{background:linear-gradient(180deg,#FFF0C2,#FFE08A)}
.awning{position:absolute;inset:0 0 auto 0;height:16cqh;background:repeating-linear-gradient(90deg,var(--coral) 0 46px,#fff 46px 92px);-webkit-mask:radial-gradient(circle 23px at 23px 100%,transparent 98%,#000) 0 0/46px 100%;mask:radial-gradient(circle 23px at 23px 100%,transparent 98%,#000) 0 0/46px 100%}
.mk{position:absolute;inset:16cqh 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh}
.mbasket{position:relative;width:min(52cqh,70cqw);height:min(34cqh,46cqw);border-radius:20px 20px 50px 50px;background:repeating-linear-gradient(-45deg,#C98B4A 0 10px,#B5763A 10px 20px);border:5px solid #8C5523;overflow:hidden}
.mango{position:absolute;translate:-50% -50%;font-size:min(10cqh,12cqw);transition:scale .2s}
.mango.lit{scale:1.35;filter:drop-shadow(0 0 8px #fff)}
.mango.jump{animation:hop .5s}
.cloth{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#6C4BEF 0 22px,#8B6EFF 22px 44px);transform:translateY(-105%);transition:transform .45s cubic-bezier(.4,1.4,.5,1);display:grid;place-items:center;font:800 min(6cqh,30px)/1 var(--display);color:#fff}
.covered .cloth{transform:translateY(0)}
.choices{display:flex;gap:3cqw}
.numbtn{width:min(19cqh,22cqw);aspect-ratio:1;border:none;border-radius:24px;background:#fff;box-shadow:0 6px 0 rgba(43,33,64,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.numbtn b{font:800 min(10cqh,11cqw)/1 var(--display);color:var(--grape)}
.numbtn span{font-size:min(2.6cqh,14px);color:var(--orange);letter-spacing:2px}
.numbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,33,64,.2)}
.numbtn.right{background:#D8F5D0}
.rounds{position:absolute;right:12px;top:calc(16cqh + 8px);display:flex;gap:4px;font-size:22px;z-index:3}
.rounds i{font-style:normal;filter:grayscale(1);opacity:.35}
.rounds i.on{filter:none;opacity:1}

/* ---------- page 6: road trace ---------- */
.fillsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tuk{transition:transform .08s linear}
.ring{animation:ring 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}

/* ---------- page 7: shapes ---------- */
.sc-wood{background:linear-gradient(180deg,#BFE8FF 0 40%,#9BE07A 40%)}
.sorter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:10px}
.board{display:flex;gap:min(4cqw,24px);padding:min(3cqh,18px) min(4cqw,26px);border-radius:28px;background:repeating-linear-gradient(90deg,#E5A35C 0 18px,#DB9750 18px 22px);border:6px solid #A8642A;box-shadow:0 10px 0 rgba(43,33,64,.18)}
.hole,.piece{position:relative;width:min(21cqh,18cqw);aspect-ratio:1}
.hole svg,.piece svg{width:100%;height:100%;overflow:visible;display:block}
.hole .placed{position:absolute;inset:0}
.pieces{display:flex;gap:min(5cqw,30px);flex-wrap:wrap;justify-content:center}
.piece{border:none;background:none;padding:0}
.tuk-deco{position:absolute;left:3cqw;top:3cqh;font-size:min(14cqh,12cqw);animation:wiggle 2s infinite}

/* ---------- page 8: Ali says ---------- */
.sc-lawn{background:radial-gradient(circle at 50% 120%,#7DD56F 0 45%,transparent 46%),linear-gradient(180deg,#FFE6F2,#E5F7FF)}
.says-ali{position:absolute;left:50%;bottom:4cqh;width:min(56cqh,44cqw);aspect-ratio:1;translate:-50% 0}
.says-ali.a-jump{animation:sjump .55s cubic-bezier(.3,1.4,.5,1) 3}
@keyframes sjump{50%{translate:-50% -22%}}
.says-ali.a-spin{animation:sspin 1.2s ease-in-out}
@keyframes sspin{to{rotate:360deg}}
.says-ali.a-stomp{animation:sstomp .3s 5}
@keyframes sstomp{50%{scale:1.06 .9;translate:-48% 2%}}
.says-ali.a-reach{animation:sreach 1.4s ease-in-out}
@keyframes sreach{50%{scale:.95 1.2}}
.says-ali.a-wiggle{animation:swig .25s 6}
@keyframes swig{25%{skew:6deg 0}75%{skew:-6deg 0}}
.card{position:absolute;left:4cqw;top:4cqh;width:min(30cqh,26cqw);padding:10px;border-radius:22px;background:#fff;border:4px solid var(--ink);text-align:center;box-shadow:0 6px 0 rgba(43,33,64,.18);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.card .big{font-size:min(14cqh,12cqw);line-height:1}
.card .lbl{font:800 min(4.4cqh,22px)/1.1 var(--display)}
.card.pop{transform:scale(1.12) rotate(-3deg)}
.says-btns{position:absolute;right:4cqw;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:3cqh}
.bigbtn{border:none;border-radius:26px;padding:10px 16px;min-width:min(26cqh,24cqw);font:800 min(5cqh,24px)/1.1 var(--display);box-shadow:0 6px 0 rgba(43,33,64,.25);display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .3s}
.bigbtn span{font-size:min(10cqh,46px);line-height:1}
.bigbtn.go{background:var(--leaf);color:#fff}
.bigbtn.stop{background:var(--coral);color:#fff}
.bigbtn:disabled{opacity:.4}
.dots{position:absolute;left:50%;top:8px;translate:-50% 0;display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(43,33,64,.15)}
.dots i.on{background:var(--sun);box-shadow:0 0 0 3px #fff}
@container (orientation:portrait){.says-ali{width:62cqw;bottom:22cqh}.says-btns{top:auto;bottom:3cqh;translate:0 0;right:50%;transform:translateX(50%);flex-direction:row}.card{width:40cqw}}

/* ---------- page 9: patterns ---------- */
.sc-paddy{background:linear-gradient(180deg,#BDEBFF 0 30%,transparent 30%),repeating-linear-gradient(180deg,#8EDB7B 0 22px,#7ACB67 22px 44px)}
.pat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:12px}
.fence{display:flex;gap:min(1.6cqw,10px);padding:10px 14px;border-radius:20px;background:#fff;border:4px solid #C98B4A;box-shadow:0 8px 0 rgba(43,33,64,.15);flex-wrap:wrap;justify-content:center}
.cell{width:min(14cqh,12cqw);aspect-ratio:1;display:grid;place-items:center;font-size:min(10cqh,9cqw);border-radius:16px;background:var(--paper2);transition:scale .2s}
.cell.q{border:4px dashed var(--grape);background:#F1ECFF;font:800 min(9cqh,8cqw)/1 var(--display);color:var(--grape);animation:selpulse 1.4s infinite}
.cell.sing{scale:1.22;background:#FFF0B3}
.pchoices{display:flex;gap:min(4cqw,24px)}
.pbtn{width:min(20cqh,18cqw);aspect-ratio:1;border:none;border-radius:24px;background:#fff;font-size:min(13cqh,11cqw);box-shadow:0 6px 0 rgba(43,33,64,.2)}

/* ---------- page 10: maze ---------- */
.sc-tea{background:#B7E7A0}
.train{transition:transform .22s ease-out}
.nextcell{animation:fadeOut 1s ease-in-out 3 alternate}

/* ---------- page 11: memory ---------- */
.sc-river{background:linear-gradient(180deg,#7FD3FF,#3FA9F5)}
.sc-river::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 120%,transparent 0 30px,rgba(255,255,255,.12) 30px 34px);animation:ripple 6s linear infinite}
@keyframes ripple{to{background-position:0 -68px}}
.mem{position:absolute;inset:0;display:grid;place-content:center;gap:min(2cqmin,14px);grid-template-columns:repeat(var(--c),var(--cw))}
.mcard{width:var(--cw);aspect-ratio:3/4;perspective:800px;border:none;background:none;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 6px 0 rgba(43,33,64,.2)}
.mcard .b{background:radial-gradient(circle at 50% 50%,#FFE7A6 0 22%,transparent 23%),repeating-linear-gradient(45deg,#18B6A6 0 12px,#14A193 12px 24px);font-size:calc(var(--cw)*.32)}
.mcard .f{background:#fff;transform:rotateY(180deg);font-size:calc(var(--cw)*.55)}
.mcard.matched .f{background:#D8F5D0;animation:hop .6s}

/* ---------- page 12: sand ---------- */
.sc-sand{background:radial-gradient(rgba(176,122,60,.25) 1.5px,transparent 2px) 0 0/16px 16px,#F6D8A0}
.wave{position:absolute;left:-10%;right:-10%;top:-6cqh;height:16cqh;background:radial-gradient(circle at 50% 0,#7FD3FF 0 60%,transparent 61%) 0 0/120px 100%,linear-gradient(#7FD3FF,#7FD3FF) 0 0/100% 40% no-repeat;animation:wave 4s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes wave{50%{transform:translateY(2.5cqh) translateX(30px)}}
.sandcv{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
.steps{position:absolute;left:50%;bottom:8px;translate:-50% 0;display:flex;gap:6px;z-index:3}
.steps span{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.7);font:700 min(3.6cqh,18px)/1.3 var(--display);color:var(--muted)}
.steps span.on{background:var(--grape);color:#fff}
.stick{position:absolute;z-index:4;font-size:min(9cqmin,48px);translate:-30% -80%;pointer-events:none;opacity:0;transition:opacity .3s}

/* ---------- page 13: shells ---------- */
.sc-beach{background:linear-gradient(180deg,#7FD3FF 0 22%,#FFF0C2 22%)}
.shells{position:absolute;left:4cqw;right:4cqw;top:26cqh;display:flex;flex-wrap:wrap;justify-content:center;gap:min(3cqw,18px)}
.shell{width:min(17cqh,14cqw);aspect-ratio:1;border:none;background:none;padding:0}
.shell svg,.bucket svg{width:100%;height:100%;display:block;overflow:visible}
.buckets{position:absolute;left:0;right:0;bottom:3cqh;display:flex;justify-content:space-around}
.bucket{position:relative;width:min(30cqh,26cqw);aspect-ratio:1.1}
.bucket .badge{position:absolute;left:50%;top:-30%;translate:-50% 0;width:46%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid var(--ink);padding:8%;transition:transform .5s}
.bucket .badge.flip{transform:rotateY(360deg)}
.bucket.bounce{animation:hop .5s}
.banner{position:absolute;left:50%;top:40%;translate:-50% -50%;z-index:10;padding:10px 26px;border-radius:24px;background:var(--grape);color:#fff;font:800 min(12cqh,60px)/1 var(--display);box-shadow:0 8px 0 #3F26A8;animation:bannerIn 1.6s cubic-bezier(.3,1.6,.5,1) forwards;pointer-events:none}
@keyframes bannerIn{0%{transform:scale(0) rotate(-20deg)}25%{transform:scale(1.15) rotate(4deg)}35%,80%{transform:scale(1) rotate(0)}100%{transform:scale(0);opacity:0}}

/* ---------- page 14: lantern ---------- */
.sc-eve{background:linear-gradient(180deg,#3B2A86 0%,#6C4BEF 60%,#FF9F7A 100%)}
.lwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-evenly;gap:10px;padding:10px}
.lant{position:relative;display:flex;flex-direction:column;align-items:center}
.lant::before{content:"";width:3px;height:6cqh;background:#FFE7A6}
.lant .lbl{font:700 min(4cqh,18px)/1 var(--display);color:#FFE7A6;margin-bottom:6px;order:-1}
.kudu{transform:rotate(45deg);display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;padding:7px;background:#B5763A;border-radius:8px;aspect-ratio:1;margin:12%;transition:box-shadow .6s}
.model .kudu{width:min(20cqh,16cqw)}
.mine .kudu{width:min(40cqh,30cqw)}
.pane{border:none;padding:0;border-radius:4px;background:rgba(255,255,255,.85);background-image:radial-gradient(rgba(108,75,239,.15) 2px,transparent 3px);background-size:12px 12px;transition:background-color .25s,transform .2s}
.mine .pane:active{transform:scale(.9)}
.tassels{display:flex;gap:4px;margin-top:-4%}
.tassels i{width:5px;height:6cqh;border-radius:3px;transform-origin:top;animation:tassel 1.8s ease-in-out infinite}
.tassels i:nth-child(odd){animation-delay:-.6s}
@keyframes tassel{50%{transform:rotate(12deg)}}
.lant.lit{animation:sway 2.4s ease-in-out infinite;transform-origin:top center}
.lant.lit .kudu{box-shadow:0 0 30px 10px #FFD36E,0 0 80px 30px rgba(255,201,60,.5)}
@keyframes sway{50%{rotate:5deg}}
.pots{display:flex;flex-direction:column;gap:min(2.4cqh,14px)}
.pot{width:min(15cqh,13cqw);aspect-ratio:1;border:4px solid #fff;border-radius:50% 50% 40% 40%;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .2s}
.pot.sel{transform:translateY(-8px) scale(1.12);box-shadow:0 0 0 6px #fff,0 0 24px 6px rgba(255,255,255,.8)}
@container (orientation:portrait){.lwrap{flex-direction:column}.pots{flex-direction:row}.mine .kudu{width:min(46cqw,30cqh)}.model .kudu{width:min(24cqw,14cqh)}}

/* ---------- page 15: night party ---------- */
.sc-night{background:linear-gradient(180deg,#141045 0%,#2B1F7A 60%,#3B2A86 100%)}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
.moon{position:absolute;right:6cqw;top:6cqh;width:min(16cqh,14cqw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFFBE0,#FFE38A);box-shadow:0 0 40px 10px rgba(255,227,138,.4)}
.sea{position:absolute;left:0;right:0;bottom:0;height:18cqh;background:repeating-radial-gradient(circle at 50% 0,#3FA9F5 0 10px,#2C8ED6 10px 20px);opacity:.9}
.hang{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:sway 3s ease-in-out infinite}
.hang::before{content:"";width:2px;height:var(--h);background:#FFE7A6}
.hang b{width:min(7cqh,6cqw);aspect-ratio:1;transform:rotate(45deg);border-radius:4px;background:var(--c);box-shadow:0 0 18px 6px color-mix(in srgb,var(--c) 60%,transparent)}
.pair{position:absolute;left:50%;bottom:8cqh;translate:-50% 0;display:flex;align-items:flex-end}
.pair .g{width:min(46cqh,34cqw);aspect-ratio:1}
.pair .a{width:min(34cqh,25cqw);aspect-ratio:1;margin-left:-6%}
.album{position:absolute;left:50%;bottom:2cqh;translate:-50% 0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:92cqw;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.9)}
.album button{border:none;background:none;padding:0 2px;font-size:min(7cqh,34px);line-height:1.2}
.album button:disabled{opacity:.2}
.placed-st{position:absolute;z-index:3;font-size:min(9cqh,44px);animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
.gn{position:absolute;left:3cqw;top:3cqh;z-index:6;border:none;border-radius:999px;padding:8px 16px;background:var(--sun);font:800 min(4.6cqh,22px)/1 var(--display);box-shadow:0 5px 0 #D99A00}
.cert{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(20,16,69,.55);animation:fadeIn .6s both}
.cert .box{width:min(88cqw,560px);padding:min(4cqh,24px);border-radius:28px;background:#fff;text-align:center;border:6px solid var(--sun);box-shadow:0 12px 0 rgba(0,0,0,.25);animation:bannerPop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bannerPop{from{transform:scale(.3) rotate(-8deg)}}
.cert h3{margin:0;font:800 min(8cqh,44px)/1 var(--display);color:var(--grape)}
.cert p{margin:.4em 0;font-size:min(4cqh,20px)}
.cert .row{font-size:min(6cqh,34px);line-height:1.3;word-break:break-all}
.cert button{margin-top:8px;border:none;border-radius:999px;padding:10px 22px;background:var(--leaf);color:#fff;font:800 min(4.6cqh,22px)/1 var(--display);box-shadow:0 5px 0 #2E8F3B}

/* ---------- grown-up overlays ---------- */
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(43,33,64,.55)}
.sheet{width:min(520px,100%);max-height:100%;overflow:auto;border-radius:24px;background:var(--paper);padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:16px}
.sheet h3{margin:0 0 8px;font:800 26px/1.1 var(--display)}
.sheet p{margin:.4em 0 .8em;line-height:1.45}
.sheet .x{float:right;width:40px;height:40px;border-radius:50%;border:none;background:var(--paper2);font-size:18px}
.gatebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gatebtns button{aspect-ratio:1;border:none;border-radius:18px;background:#fff;font-size:34px;box-shadow:0 4px 0 rgba(43,33,64,.15)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #EADFC8}
.opt b{font:700 17px/1.2 var(--display)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:2px solid var(--grape);background:#fff;border-radius:999px;padding:6px 12px;font:700 15px/1 var(--display);color:var(--grape)}
.seg button.on{background:var(--grape);color:#fff}
.tipbox{margin-top:10px;padding:12px 14px;border-radius:16px;background:#E9FBF7;border:2px solid var(--teal);line-height:1.45}
.tipbox b{font-family:var(--display)}
.restart{margin-top:12px;border:none;border-radius:999px;padding:10px 18px;background:var(--coral);color:#fff;font:700 16px/1 var(--display)}
.breakcard{text-align:center}
.breakcard .ali{width:160px;height:160px;margin:0 auto}

/* ---------- depth & motion layer ---------- */
.book{animation:bookIn 1s cubic-bezier(.3,1.3,.5,1) both;box-shadow:0 5px 0 #4A2BC0,0 10px 0 #3A1F9E,0 28px 50px rgba(43,33,64,.42),inset 0 0 0 3px rgba(255,255,255,.25),inset 0 3px 0 rgba(255,255,255,.35)}

<script>
(() => {
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const WORDS = ['zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];
const SVGNS = 'http://www.w3.org/2000/svg';
const COLORS = ['#FFC93C','#FF5A5F','#18B6A6','#6C4BEF','#4CBF5A','#FF7EB6','#3FA9F5','#FF9F43'];

const store = {
  get(k, d) { try { const v = localStorage.getItem('alibook_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('alibook_' + k, JSON.stringify(v)); } catch (e) {} }
};
const state = {
  page: store.get('page', 0), stickers: store.get('stickers', {}),
  level: store.get('level', 'easy'), voice: store.get('voice', true),
  sound: store.get('sound', true), timer: store.get('timer', 0)
};
const save = () => { store.set('page', state.page); store.set('stickers', state.stickers); store.set('level', state.level); store.set('voice', state.voice); store.set('sound', state.sound); store.set('timer', state.timer); };

function again(node, cls, ms = 700) { node.classList.remove(cls); void node.getBoundingClientRect(); node.classList.add(cls); setTimeout(() => node.classList.remove(cls), ms); }
function glow(node) { if (node) again(node, 'glow', 2900); }
function center(node) { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function toSVG(svg, e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function starPath(cx, cy, R, r, n) { let d = ''; for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); } return d + 'Z'; }

/* ================= sound ================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur = .15, type = 'sine', vol = .2, when = 0, slide = 0) {
  if (!state.sound) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur = .3, vol = .15, freq = 1200, when = 0) {
  if (!state.sound) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8; g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175];
const sfx = {
  tap() { tone(700, .06, 'triangle', .1); },
  pop() { tone(rand(450, 750), .12, 'sine', .3, 0, 2.4); noise(.05, .1, 3000); },
  boop() { tone(300, .2, 'triangle', .16, 0, .6); },
  boing() { tone(160, .4, 'sine', .22, 0, 3); },
  ding() { tone(988, .25, 'sine', .18); tone(1319, .35, 'sine', .14, .08); },
  tada() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .32, 'triangle', .16, i * .1)); tone(1568, .6, 'sine', .1, .42); },
  flip() { noise(.35, .14, 1600); noise(.2, .08, 3200, .12); },
  munch() { [0, .13, .26].forEach(w => noise(.07, .25, 800, w)); },
  note(i) { tone(SCALE[i % SCALE.length], .32, 'triangle', .17); },
  crow() { tone(520, .16, 'sawtooth', .06, 0, 1.6); tone(840, .55, 'sawtooth', .06, .16, .55); },
  yawn() { tone(420, .7, 'sine', .14, 0, .5); },
  chug() { noise(.08, .18, 500); },
  toot() { tone(660, .25, 'square', .06); tone(660, .45, 'square', .06, .3); },
  whoosh() { noise(.45, .16, 900); },
  splash() { noise(.25, .12, 2400); },
  sparkle() { [0, 1, 2, 3].forEach(i => tone(1568 + i * 220, .15, 'sine', .06, i * .05)); }
};

/* ================= voice ================= */
let voice = null, lastSaid = '';
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^en/i.test(v.lang) && /samantha|karen|moira|tessa|zira|female|google uk english female|serena|libby|sonia/i.test(v.name))
      || vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, remember = true) {
  if (remember) lastSaid = text;
  if (!state.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.rate = .9; u.pitch = 1.25; speechSynthesis.speak(u); } catch (e) {}
}

/* ================= effects ================= */
const FX = $('#fx');
function confetti(x, y, n = 36, spread = 260) {
  for (let i = 0; i < n; i++) {
    const p = el('i', 'conf'); const c = pick(COLORS);
    if (Math.random() < .35) { p.textContent = pick(['★', '✦', '♥']); p.style.color = c; p.style.background = 'none'; } else p.style.background = c;
    p.style.left = x + 'px'; p.style.top = y + 'px'; FX.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(spread * .3, spread);
    p.animate([{ transform: 'translate(-50%,-50%) perspective(300px) rotateX(0) rotateY(0) rotateZ(0)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 140}px) perspective(300px) rotateX(${rand(360, 1080)}deg) rotateY(${rand(-720, 720)}deg) rotateZ(${rand(-360, 360)}deg)`, opacity: 0 }],
      { duration: rand(900, 1700), easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
  }
}
function starBurst(x, y) {
  const st = el('div', 'bigstar', '⭐'); st.style.left = x + 'px'; st.style.top = y + 'px'; FX.appendChild(st);
  st.animate([{ transform: 'translate(-50%,-50%) perspective(500px) rotateY(0) scale(0)', opacity: 1 },
    { transform: 'translate(-50%,-50%) perspective(500px) rotateY(540deg) scale(1.25)', opacity: 1, offset: .55 },
    { transform: 'translate(-50%,-50%) perspective(500px) rotateY(720deg) scale(1.7)', opacity: 0 }], { duration: 1400, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => st.remove();
  ['#FFC93C', '#FF7EB6', '#3FA9F5'].forEach((c, k) => { const r = el('div', 'ringburst'); r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.borderColor = c; FX.appendChild(r);
    r.animate([{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(8)', opacity: 0 }], { duration: 950, delay: k * 160, easing: 'ease-out', fill: 'backwards' }).onfinish = () => r.remove(); });
}
function sparkleAt(node, n = 14) { const c = center(node); confetti(c.x, c.y, n, 90); }
function floatUp(x, y, txt) {
  const p = el('div', 'heart', txt); p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.position = 'fixed'; FX.appendChild(p);
  p.animate([{ transform: 'translate(-50%,-50%) scale(.5)', opacity: 1 }, { transform: `translate(${rand(-60, 60) - 50}%, -260%) scale(1.4)`, opacity: 0 }], { duration: 1200, easing: 'ease-out' }).onfinish = () => p.remove();
}
function flySticker(emoji, from) {
  const s = el('div', 'flysticker', emoji), b = center($('#bag'));
  s.style.left = from.x + 'px'; s.style.top = from.y + 'px'; FX.appendChild(s);
  const dx = b.x - from.x, dy = b.y - from.y;
  s.animate([{ transform: 'translate(-50%,-50%) perspective(500px) rotateY(0) scale(0) rotate(-40deg)' }, { transform: 'translate(-50%,-50%) perspective(500px) rotateY(360deg) scale(1.5) rotate(10deg)', offset: .3 },
    { transform: 'translate(-50%,-50%) perspective(500px) rotateY(360deg) scale(1.3) rotate(-4deg)', offset: .6 }, { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) perspective(500px) rotateY(720deg) scale(.25)` }],
    { duration: 1700, easing: 'ease-in-out' }).onfinish = () => { s.remove(); again($('#bag'), 'bump', 600); sfx.ding(); updateBar(); };
}

/* ================= Ali (drawn character) ================= */
let aliN = 0;
function aliSVG(cls = '') {

/* ================= drag OR tap-then-tap ================= */
function makeDnD({ onDrop, pad = 36 }) {
  let selected = null; const targets = [];
  const clearSel = () => { if (selected) selected.classList.remove('selected'); selected = null; targets.forEach(t => t.classList.remove('want')); };
  const hit = (x, y) => {
    let best = null, bd = 1e9;
    for (const t of targets) { if (t.dataset.off) continue; const r = t.getBoundingClientRect();
      if (x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad) { const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)); if (d < bd) { bd = d; best = t; } } }
    return best;
  };
  const back = it => { it.style.transition = ''; it.style.transform = ''; it._dx = it._dy = 0; it.classList.remove('lifting'); };
  const attempt = (it, t) => { const ok = onDrop(it, t); if (!ok) { sfx.boop(); back(it); again(it, 'nope', 500); } else it.classList.remove('lifting'); clearSel(); return ok; };
  return {
    item(it) {
      it.classList.add('dragitem'); let sx = 0, sy = 0, moved = false, id = null;
      it.addEventListener('pointerdown', e => {
        if (it.dataset.used) return; e.preventDefault(); id = e.pointerId;
        try { it.setPointerCapture(id); } catch (er) {}
        sx = e.clientX; sy = e.clientY; moved = false; it._dx = it._dy = 0; it.style.transition = 'none'; it.classList.add('lifting'); sfx.tap();
      });
      it.addEventListener('pointermove', e => {
        if (e.pointerId !== id) return; const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) > 12) moved = true;
        if (moved) { it._dx = dx; it._dy = dy; it.style.transform = `translate(${dx}px,${dy}px) scale(1.15)`; const t = hit(e.clientX, e.clientY); targets.forEach(x => x.classList.toggle('over', x === t)); }
      });
      it.addEventListener('pointerup', e => {
        if (e.pointerId !== id) return; id = null; targets.forEach(x => x.classList.remove('over'));
        if (moved) { const t = hit(e.clientX, e.clientY); if (t) attempt(it, t); else { back(it); clearSel(); } }
        else { back(it); if (selected === it) clearSel(); else { clearSel(); selected = it; it.classList.add('selected'); targets.forEach(t => !t.dataset.off && t.classList.add('want')); } }
      });
      it.addEventListener('pointercancel', () => { id = null; back(it); });
    },
    target(t) { targets.push(t); t.addEventListener('pointerup', () => { if (selected && !selected.dataset.used) attempt(selected, t); }); },
    clearSel
  };
}
function flyTo(it, t, { scale = .25, fade = true, rotate = 0, dur = 420 } = {}) {
  return new Promise(res => {
    const r = it.getBoundingClientRect(), tr = t.getBoundingClientRect();
    const bx = r.left + r.width / 2 - (it._dx || 0), by = r.top + r.height / 2 - (it._dy || 0);
    const tx = tr.left + tr.width / 2 - bx, ty = tr.top + tr.height / 2 - by;
    it.style.transition = `transform ${dur}ms cubic-bezier(.3,.9,.4,1.15), opacity ${dur}ms`;
    it.style.transform = `translate(${tx}px,${ty}px) scale(${scale}) rotate(${rotate}deg)`;
    if (fade) it.style.opacity = '0';
    setTimeout(res, dur);
  });
}

      <text x="${(C - .5) * U}" y="${(R - .5) * U}" font-size="58" text-anchor="middle" dominant-baseline="central">🚉</text>
      <g class="train" style="transform:translate(${U / 2}px,${U / 2}px)"><g class="tflip"><text font-size="58" text-anchor="middle" dominant-baseline="central">🚂</text></g></g>
    </svg>`;
    const svg = $('svg', s), train = $('.train', s), flip = $('.tflip', s), trail = $('.trail', s), hl = $('.hl', s);

/* ================= page engine ================= */
const pagesEl = $('.pages'), prevBtn = $('#prev'), nextBtn = $('#next'), veil = $('#veil');
let cur = null, busy = false, lastAct = Date.now();

function buildPage(i) {
  const P = PAGES[i];
  const pg = el('section', 'page');
  pg.style.setProperty('--tint', P.tint);
  pg.innerHTML = `<div class="phead"><span class="pnum">${i + 1}</span><h2 class="ptitle">${P.title}</h2><button class="iconbtn replay" aria-label="Hear it again">🔊</button></div>
    <div class="stage"></div><div class="instr"><div class="mini">${aliSVG()}</div><p></p></div><div class="shade"></div>`;
  const timers = [], cleanups = []; let alive = true;
  const ctx = {
    stage: $('.stage', pg), hard: state.level === 'hard', completed: !!state.stickers[i], hint: null,
    get alive() { return alive; },
    say(t, speak = true) { $('.instr p', pg).textContent = t; if (speak) say(t); else lastSaid = t; },
    timeout(f, ms) { const id = setTimeout(() => alive && f(), ms); timers.push(() => clearTimeout(id)); return id; },
    loop(f) { let last = performance.now(); const step = t => { if (!alive) return; f(Math.min(50, t - last) / 1000, t); last = t; requestAnimationFrame(step); }; requestAnimationFrame(step); },
    onCleanup(f) { cleanups.push(f); },
    done(from) {
      if (ctx._finished) return; ctx._finished = true; ctx.completed = true;
      const first = !state.stickers[i]; state.stickers[i] = true; save();
      const c = from ? center(from) : center(ctx.stage);
      confetti(c.x, c.y, 60); starBurst(c.x, c.y); sfx.tada();
      $$('.stage .ali', pg).forEach(a => again(a, 'hop', 600));
      if (first) setTimeout(() => flySticker(P.sticker, c), 500); else updateBar();
      ctx.say(P.done || pick(PRAISE));
      if (i < PAGES.length - 1) setTimeout(() => { if (!alive) return; nextBtn.classList.add('pulse', 'center'); veil.classList.add('on'); sfx.sparkle(); }, 1500);
    }
  };
  $('.replay', pg).onclick = () => { sfx.tap(); say(lastSaid || $('.instr p', pg).textContent); };
  $('.instr p', pg).textContent = P.intro(ctx.hard);
  return { pg, ctx, i, destroy() { alive = false; timers.forEach(f => f()); cleanups.forEach(f => { try { f(); } catch (e) {} }); } };
}

function go(n, instant = false) {
  if (busy || n < 0 || n >= PAGES.length) return;
  busy = true; try { speechSynthesis.cancel(); } catch (e) {}
  const old = cur, dir = old ? Math.sign(n - old.i) : 0, nw = buildPage(n);
  nextBtn.classList.remove('pulse', 'center'); veil.classList.remove('on');
  if (!old || instant) { pagesEl.appendChild(nw.pg); PAGES[n].build(nw.ctx); nw.pg.classList.add('enter'); if (old) { old.destroy(); old.pg.remove(); } finish(); }
  else if (dir > 0) {
    pagesEl.insertBefore(nw.pg, old.pg); PAGES[n].build(nw.ctx); nw.pg.classList.add('reveal', 'enter'); old.destroy(); old.pg.classList.add('turn-out'); sfx.flip();
    setTimeout(() => { old.pg.remove(); const leaf = el('div', 'leaf leaf-out'); pagesEl.appendChild(leaf); setTimeout(() => leaf.remove(), 480); }, 430);
    setTimeout(() => { nw.pg.classList.remove('reveal'); finish(); }, 900);
  } else {
    pagesEl.appendChild(nw.pg); PAGES[n].build(nw.ctx); nw.pg.style.visibility = 'hidden'; old.destroy(); sfx.flip();
    const leaf = el('div', 'leaf leaf-in'); pagesEl.appendChild(leaf);
    setTimeout(() => { leaf.remove(); old.pg.remove(); nw.pg.style.visibility = ''; nw.pg.classList.add('turn-in', 'enter'); }, 410);
    setTimeout(() => { nw.pg.classList.remove('turn-in'); finish(); }, 880);
  }
  cur = nw; state.page = n; save(); updateBar();
  function finish() { busy = false; lastAct = Date.now(); shapeWas = isTall(); setTimeout(() => nw.pg.classList.remove('enter'), 1100); const t = PAGES[n].intro(nw.ctx.hard); lastSaid = t; if (n !== 0 || old) say(t); }
}

function updateBar() {
  const prog = $('.progress');
  if (!prog.children.length) prog.innerHTML = PAGES.map(() => '<i></i>').join('');
  [...prog.children].forEach((d, i) => { d.classList.toggle('got', !!state.stickers[i]); d.classList.toggle('cur', cur && cur.i === i); });
  $('#bag b').textContent = Object.keys(state.stickers).length;
  $('.pcount').textContent = cur ? `Page ${cur.i + 1} of ${PAGES.length}` : '';
  prevBtn.disabled = !cur || cur.i === 0;
  nextBtn.disabled = !cur || cur.i === PAGES.length - 1;
}

prevBtn.onclick = () => { sfx.tap(); go(cur.i - 1); };
nextBtn.onclick = () => { sfx.tap(); go(cur.i + 1); };
$('#bag').onclick = () => { sfx.tap(); const n = Object.keys(state.stickers).length; say(n ? `You have ${n} sticker${n > 1 ? 's' : ''}!` : 'Finish a page to win a sticker!', false); again($('#bag'), 'bump', 600); };

document.addEventListener('pointerdown', () => { lastAct = Date.now(); ac(); }, true);

/* no zooming: block double-tap zoom and pinch zoom, but keep quick taps working */
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 380) { e.preventDefault(); const b = e.target.closest && e.target.closest('button'); if (b && !b.disabled) b.click(); }
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* rotate phone → re-lay out the pages whose layout depends on screen shape */
const SHAPED = new Set([1, 5, 9, 10]);
let shapeWas = null, rz = null;
const isTall = () => cur && cur.ctx.stage.clientHeight > cur.ctx.stage.clientWidth;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
  if (!cur || busy) return; const t = isTall();
  if (shapeWas !== null && t !== shapeWas && SHAPED.has(cur.i)) go(cur.i, true);
  shapeWas = isTall();
}, 350); });
setInterval(() => {
  if (!cur || busy || cur.ctx.completed || !cur.ctx.hint) return;
  if (Date.now() - lastAct > 9000) { lastAct = Date.now(); try { cur.ctx.hint(); } catch (e) {} }
}, 1000);

  $('.x', o).onclick = () => o.remove();
  $$('.gatebtns button', o).forEach(b => b.onclick = () => { if (b.dataset.n === ask[step][0]) { step++; if (step === 2) { o.remove(); onPass(); } } else { again($('.sheet', o), 'nope', 500); step = 0; } });

  const P = cur ? PAGES[cur.i] : PAGES[0];
  const o = overlay(`<button class="x" aria-label="Close">✕</button><h3>Grown-up corner</h3>
    <div class="opt"><b>Difficulty</b><div class="seg" data-k="level"><button data-v="easy">Age 3–4</button><button data-v="hard">Age 5–6</button></div></div>
    <div class="opt"><b>Ali's voice</b><div class="seg" data-k="voice"><button data-v="true">On</button><button data-v="false">Off</button></div></div>
    <div class="opt"><b>Sounds</b><div class="seg" data-k="sound"><button data-v="true">On</button><button data-v="false">Off</button></div></div>
    <div class="opt"><b>Play timer</b><div class="seg" data-k="timer"><button data-v="0">Off</button><button data-v="10">10 min</button><button data-v="15">15 min</button><button data-v="20">20 min</button></div></div>
    <div class="tipbox"><b>Try this off-screen (page ${cur ? cur.i + 1 : 1}):</b><br>${P.tip}</div>
    <p style="color:var(--muted);font-size:14px">Nothing is collected or sent anywhere. Progress is saved only on this device. Finger tracing is a warm-up: follow each page with crayons and paper.</p>
    <button class="restart">Start the book again</button>`);
  const paint = () => $$('.seg', o).forEach(sg => $$('button', sg).forEach(b => b.classList.toggle('on', String(state[sg.dataset.k]) === b.dataset.v)));
  paint();
  $$('.seg button', o).forEach(b => b.onclick = () => {
    const k = b.parentElement.dataset.k, v = b.dataset.v; const val = k === 'level' ? v : k === 'timer' ? +v : v === 'true';
    const changed = state[k] !== val; state[k] = val; save(); paint();
    if (k === 'level' && changed && cur) { cur.ctx.completed = true; setTimeout(() => go(cur.i, true), 50); }
    if (k === 'timer') { sessionStart = Date.now(); warned = false; }
    if (k === 'voice' && !val) try { speechSynthesis.cancel(); } catch (e) {}
  });
  $('.restart', o).onclick = () => { state.stickers = {}; save(); o.remove(); go(0, true); };
  $('.x', o).onclick = () => o.remove();
}
$('#gear').onclick = () => gate(settings);

let sessionStart = Date.now(), warned = false, onBreak = false;
setInterval(() => {
  if (!state.timer || onBreak) return; const left = state.timer * 60000 - (Date.now() - sessionStart);
  if (left < 60000 && !warned) { warned = true; sfx.ding(); say('One more page, then it is time for a break!', false); }
  if (left <= 0) {
    onBreak = true; try { speechSynthesis.cancel(); } catch (e) {}
    const tip = cur ? PAGES[cur.i].tip : '';
    const o = overlay(`<div class="breakcard">${aliSVG('sleep')}<h3>Break time!</h3><p>Ali is going to rest his eyes and play outside. You can too!</p><div class="tipbox"><b>Grown-ups, try this:</b><br>${tip}</div><button class="restart" style="background:var(--grape)">Grown-ups: keep playing</button></div>`);
    say('Break time! Ali is going to rest his eyes and play outside. You can too!', false);
    $('.restart', o).onclick = () => gate(() => { o.remove(); onBreak = false; warned = false; sessionStart = Date.now(); });
  }
}, 5000);

/* ================= start ================= */
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ page: cur ? cur.i : 0 })); } catch (e) {} }
const start = data => { const p = data && typeof data.page === 'number' ? data.page : state.page; updateBar(); go(Math.max(0, Math.min(PAGES.length - 1, p || 0)), true); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude && window.claude.hot && window.claude.hot.data);
})();
</script>

</body>
